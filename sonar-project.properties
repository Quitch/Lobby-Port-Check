sonar.projectKey=Quitch_Lobby-Port-Check
sonar.organization=quitch
sonar.projectVersion=1.0.0
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Set explicitly: the default is the CI runner's platform charset, which would make
# whether a file decodes cleanly depend on the machine rather than the repo.
sonar.sourceEncoding=UTF-8

# Coverage-metric exclusions. These files are still analysed for bugs and smells;
# only their lines-to-cover are dropped. The two scene scripts are engine and DOM
# wiring that Node cannot load; the logic they call lives in port_check_core.js,
# which is measured. See docs/design.md.
sonar.coverage.exclusions=\
  ui/mods/com.pa.quitch.lobbyportcheck/new_game/port_check.js,\
  ui/mods/com.pa.quitch.lobbyportcheck/connect_to_game/local_host.js,\
  test/**

# stylelint.config.mjs is long lists of "name", // Chrome NN entries. Copy-paste
# detection drops comments and normalises literals, so the lists match themselves.
sonar.cpd.exclusions=stylelint.config.mjs
